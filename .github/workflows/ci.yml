name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load versions
        run: grep -E "^[A-Z_]+=" versions.env >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v${{ env.TFLINT_VERSION }}
      - name: fmt
        run: terraform fmt -check -recursive terraform
      - name: validate
        run: make validate
      - name: tflint
        run: make lint
      - name: terraform test (mocked provider)
        run: make test

  security:
    name: trivy (IaC + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: secret
          scan-ref: .
          exit-code: "1"

  analytics:
    name: Log analytics (DuckDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r analytics/requirements.txt
      - run: python -m pytest -q analytics/tests

  e2e:
    name: Kubernetes e2e (kind, local only)
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - uses: actions/checkout@v4
      - name: Load versions
        run: grep -E "^[A-Z_]+=" versions.env >> "$GITHUB_ENV"
      - name: Install kind
        run: |
          curl -sSLo "$RUNNER_TEMP/kind" "https://kind.sigs.k8s.io/dl/v${KIND_VERSION}/kind-linux-amd64"
          chmod +x "$RUNNER_TEMP/kind" && sudo mv "$RUNNER_TEMP/kind" /usr/local/bin/kind
      - name: shellcheck
        run: shellcheck tests/e2e/*.sh hack/*.sh
      - name: e2e
        run: make e2e
