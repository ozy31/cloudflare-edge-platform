# Opt-in test overlay: a Cloudflare "quick tunnel" needs no account or
# token. Cloudflare assigns a random https://<name>.trycloudflare.com URL
# that forwards to one in-cluster service, so applying this makes the demo
# origin publicly reachable for as long as the pod runs. Only used by
# tests/e2e/run.sh when E2E_PUBLIC_TUNNEL=1.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: cloudflared
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - tunnel
          - --no-autoupdate
          - --metrics=0.0.0.0:2000
          - --url=http://web.app.svc.cluster.local:80
      - op: remove
        path: /spec/template/spec/containers/0/env
